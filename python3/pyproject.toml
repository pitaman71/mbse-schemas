[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-schemas"
version = "0.7.2"
description = "Neutral, language-independent schemas for interfaces and MBSE models: objects, relations, unions and intersections, with JSON/YAML and validation"
keywords = ["schema", "mbse", "sysml", "interface", "data model", "orm", "serialization", "validation", "json", "yaml"]
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["mbse*"]
namespaces = true

[tool.setuptools.package-data]
"mbse.Schemas.Framework" = ["skill/*.md", "skill/references/*.md"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "hypothesis>=6.168.3",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tutorials"]
addopts = "--nbmake"

[tool.coverage.run]
source = ["mbse.Schemas.Framework", "mbse.Schemas.Adapters"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
