[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "schemas"
version = "0.0.1"
description = "Language-independent schema type algebra with an in-language DSL"
readme = "Framework.md"
requires-python = ">=3.11"

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["schemas*"]
namespaces = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--nbmake"
